services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bromoijen-demo-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - demo_vendor_data:/var/www/html/vendor
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - demo_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - demo_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_demo}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret_demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_demo}
      MYSQL_USER: ${DB_USERNAME:-laravel_demo}
    volumes:
      - demo_db_data:/var/lib/mysql
    networks:
      - demo_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    image: bromoijen-demo-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
      - demo_vendor_data:/var/www/html/vendor
    networks:
      - demo_net
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

networks:
  demo_net:
    driver: bridge

volumes:
  demo_db_data:
  demo_vendor_data:
