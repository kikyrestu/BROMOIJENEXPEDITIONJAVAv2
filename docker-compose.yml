services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bromoijen-app:latest
    container_name: bromoijen_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - bromoijen_net
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: bromoijen_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      # Mount your nginx.conf here in real prod
    networks:
      - bromoijen_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: bromoijen_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bromoijen_net

networks:
  bromoijen_net:
    driver: bridge

volumes:
  db_data:
